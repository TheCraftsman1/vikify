<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07132b">
  <title>Open in Vikify</title>
  <link rel="stylesheet" href="/share.css">
  <script src="/share.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">VIKIFY</p>
    <h1 id="heading">Your music, together.</h1>
    <p id="description">Open a shared Vikify song or listening invitation on your phone.</p>
    <a id="open-app" class="button" hidden>Open in Vikify</a>
    <a id="youtube" class="secondary" hidden>Listen on YouTube Music</a>
    <p class="hint">Install Vikify on your Android phone to open shared music in the app.</p>
    <noscript>Enable JavaScript to use the Open in Vikify button.</noscript>
  </main>
</body>
</html>
